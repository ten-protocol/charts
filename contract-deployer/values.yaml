image:
  repository: testnetobscuronet.azurecr.io/obscuronet/l1contractdeployer
  tag: 1.2.-beta

deploy:
  dockerImage: testnetobscuronet.azurecr.io/obscuronet/l1contractdeployer:1.2.-beta
  networkName: dev-testnet          # Update this if you want a default testnet
  outputEnv: /usr/local/bin/.env       # Adjust path if needed

secrets:
  azureClientId: "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
  azureClientSecret: "your-client-secret"
  azureTenantId: "yyyyyyyy-yyyy-yyyy-yyyy-yyyyyyyyyyyy"
  azureKeyVaultUrl: "https://your-keyvault.vault.azure.net/"
  l1HttpUrl: "https://mainnet.infura.io/v3/your-api-key"
  deployerPrivateKey: "0xabcdef123456..."