apiVersion: batch/v1
kind: Job
metadata:
  name: contract-deployer
spec:
  backoffLimit: 1
  template:
    spec:
      containers:
        # DinD Sidecar (Docker daemon running in the pod)
        - name: dind
          image: docker:dind
          securityContext:
            privileged: true
          env:
            - name: DOCKER_TLS_CERTDIR  # Disable TLS for simpler setup (dev only)
              value: ""
          volumeMounts:
            - name: dind-storage
              mountPath: /var/lib/docker

        # Your main contract deployer container
        - name: contract-deployer
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          env:
            # Connect to the DinD sidecar
            - name: DOCKER_HOST
              value: "tcp://localhost:2375"
            - name: DOCKER_API_VERSION
              value: "1.45"

            # Your original environment variables
            - name: AZURE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: deploy-secrets
                  key: azureClientId
            - name: AZURE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: deploy-secrets
                  key: azureClientSecret
            - name: AZURE_TENANT_ID
              valueFrom:
                secretKeyRef:
                  name: deploy-secrets
                  key: azureTenantId
            - name: DEPLOY_DOCKERIMAGE
              value: {{ .Values.deploy.dockerImage }}
            - name: DEPLOY_NETWORKNAME
              value: {{ .Values.deploy.networkName }}
            - name: DEPLOY_OUTPUTAZUREKV
              valueFrom:
                secretKeyRef:
                  name: deploy-secrets
                  key: azureKeyVaultUrl
            - name: DEPLOY_OUTPUTENV
              value: {{ .Values.deploy.outputEnv }}
            - name: DEPLOY_L1_RPCADDRESS
              valueFrom:
                secretKeyRef:
                  name: deploy-secrets
                  key: l1HttpUrl
            - name: DEPLOY_L1_DEPLOYERPK
              valueFrom:
                secretKeyRef:
                  name: deploy-secrets
                  key: deployerPrivateKey

          imagePullPolicy: IfNotPresent
          resources:
            limits:
              memory: "256Mi"
              cpu: "500m"

      volumes:
        - name: dind-storage
          emptyDir: {}

      restartPolicy: Never