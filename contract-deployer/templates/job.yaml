apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "contract-deployer.fullname" . }}-deployer
  labels:
    {{- include "contract-deployer.labels" . | nindent 4 }}
spec:
  backoffLimit: {{ .Values.backoffLimit | default 1 }}
  template:
    metadata:
      labels:
        {{- include "contract-deployer.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: dind
          image: docker:dind
          securityContext:
            privileged: true
          env:
            - name: DOCKER_TLS_CERTDIR
              value: ""
          volumeMounts:
            - name: dind-storage
              mountPath: /var/lib/docker
          resources:
            {{- toYaml .Values.dind.resources | nindent 12 }}

        - name: deployer
          image: {{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}
          imagePullPolicy: {{ .Values.image.pullPolicy | quote }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "Waiting for Docker daemon..."
              timeout 60 sh -c 'until docker info >/dev/null 2>&1; do sleep 1; done' || {
                echo "Timed out waiting for Docker"
                exit 1
              }
              echo "Starting contract deployer..."
              exec /usr/local/bin/l1contractdeployer
          env:
            - name: DOCKER_HOST
              value: "tcp://localhost:2375"
            - name: DOCKER_API_VERSION
              value: "1.45"
            - name: AZURE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "contract-deployer.fullname" . }}-secrets
                  key: azureClientId
            - name: AZURE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "contract-deployer.fullname" . }}-secrets
                  key: azureClientSecret
            - name: AZURE_TENANT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "contract-deployer.fullname" . }}-secrets
                  key: azureTenantId
            - name: DEPLOY_DOCKERIMAGE
              value: {{ .Values.deploy.dockerImage | quote }}
            - name: DEPLOY_NETWORKNAME
              value: {{ .Values.deploy.networkName | quote }}
            - name: DEPLOY_OUTPUTAZUREKV
              valueFrom:
                secretKeyRef:
                  name: {{ include "contract-deployer.fullname" . }}-secrets
                  key: azureKeyVaultUrl
            - name: DEPLOY_OUTPUTENV
              value: {{ .Values.deploy.outputEnv | quote }}
            - name: DEPLOY_L1_RPCADDRESS
              valueFrom:
                secretKeyRef:
                  name: {{ include "contract-deployer.fullname" . }}-secrets
                  key: l1HttpUrl
            - name: DEPLOY_L1_DEPLOYERPK
              valueFrom:
                secretKeyRef:
                  name: {{ include "contract-deployer.fullname" . }}-secrets
                  key: deployerPrivateKey
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: dind-storage
          emptyDir: {}
      restartPolicy: Never